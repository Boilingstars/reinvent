run_type = "transfer_learning"
device = "cuda:0"
tb_logdir = "tb_TL"

[parameters]
num_epochs = 3
save_every_n_epochs = 2           # writes a checkpoint every 2 epochs
batch_size = 100
sample_batch_size = 2000          # sampled each epoch to compute stats

input_model_file = "priors/reinvent.prior"    # the prior you're fine-tuning
output_model_file = "TL_reinvent.model"       # the fine-tuned model you get out
smiles_file = "train.smi"
validation_smiles_file = "val.smi"

standardize_smiles = true
randomize_smiles = true           # data augmentation — important for small sets
randomize_all_smiles = false
internal_diversity = true

