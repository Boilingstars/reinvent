run_type = "sampling"
device = "cuda:0"
json_out_config = "_sampling.json"

[parameters]
model_file = "priors/reinvent.prior"
smiles_file = "cromophores.smi"    # your input set, 1 compound per line
sample_strategy = "multinomial"    # multinomial (diverse) or beamsearch (deterministic)
temperature = 1.0                  # higher = more diverse, multinomial only
output_file = "sampled.csv"
num_smiles = 100                   # molecules generated PER input molecule
unique_molecules = true
randomize_smiles = true
